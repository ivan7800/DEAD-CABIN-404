name: Test DEAD CABIN 404
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and asset tests
        run: npm test
      - name: Local launcher HTTP smoke
        run: python3 tests/test_launcher.py
      - name: Generate self-contained HTML
        run: npm run build:single
